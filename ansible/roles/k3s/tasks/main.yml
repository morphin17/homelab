- name: Download and install K3s server
  shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: Ensure K3s service is enabled and started
  systemd:
    name: k3s
    state: started
    enabled: yes

- name: Wait for kubeconfig to be created
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    state: present

- name: Set permissions on kubeconfig for local access
  file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

  # TODO: export KUBECONFIG=/etc/rancher/k3s/k3s.yaml to ~/.bashrc

