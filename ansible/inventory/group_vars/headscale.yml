---
# Минимальный набор переменных для ansible/playbooks/headscale.yml
# Файл подхватывается автоматически: group_vars группы "headscale" из inventory.
# Полный справочник значений — ansible/collections/headscale/vars/headscale.yml


# --- Версии образов ---
# Образ собран из патча (PR #3321 + Cloudflare libdns provider); тег = headscale_version.
# Апгрейд 0.27.1 → 0.29.4: перед деплоем сделать бэкап (config.yaml, acl.json, db.sqlite).
headscale_image: "ghcr.io/morphin17/headscale"
headscale_version: "tlscert-0.29.4"
headplane_version: "0.7.0-beta.2"

# --- Subnet router: хост анонсирует клиентам свою LAN ---
headscale_router_hostname: "hs"
headscale_advertise_routes: []
headscale_exit_node_enabled: false

# --- Переменные исходной AWS-роли ---
# acl.json.j2, шаблон маршрутов и финальный debug читают их безусловно, поэтому задаём.
aws_vpc_cidr: "192.168.1.0/24"
headscale_cloudflare_ipv4: []
headscale_cloudflare_ipv6: []

# --- DNS для VPN-клиентов ---
headscale_dns_servers:
  - "8.8.8.8"

# --- TLS сертификаты для нод (tailscale cert / serve --https) ---
# Включать после переезда base_domain в Cloudflare: при пустом токене headscale
# НЕ стартует (см. guard в роли). Токен — Cloudflare API token, scope Zone.DNS:Edit.
headscale_dns_certificates_enabled: true
headscale_dns_cert_provider: "cloudflare"

# --- Пользователи и ACL (acl.json рендерится всегда) ---
headscale_default_user: "inf"

# --- Аутентификация ---
headscale_oidc_enabled: false
headplane_oidc_enabled: false

# --- Admin UI (Headplane) ---
# Не отключаем: роль падает, если запущено меньше 3 контейнеров (caddy, headscale, headplane).
headplane_enabled: true

# --- Метрики ---
headscale_metrics_enabled: true

# =============================================================================
# Health Check Configuration
# =============================================================================
# Cron schedule for health check script (idempotent, auto-repairs VPN issues)
headscale_healthcheck_schedule: "*/10 * * * *"  # Every 10 minutes
